<title>Plantão de teste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma coluna de chat com barra de plantão no topo; cada guia tem a própria cor de turno (Closure noite, Kal'tsit dia). */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --fg:#1d2321; --muted:#5f6b67; --line:#d7dcd9;
  --kal:#2f6f5e; --kal-soft:#e2efe9; --clo:#7a3b8f; --clo-soft:#f1e6f5;
  --me:#e9ecea; --flag:#b4521f; --flag-soft:#fbe9df;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151918; --panel:#1d2321; --fg:#e6ebe8; --muted:#97a39f; --line:#323b38;
  --kal:#7cc4ad; --kal-soft:#21332d; --clo:#cf9be0; --clo-soft:#2f2336;
  --me:#262d2b; --flag:#f0a070; --flag-soft:#3a271c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151918; --panel:#1d2321; --fg:#e6ebe8; --muted:#97a39f; --line:#323b38;
  --kal:#7cc4ad; --kal-soft:#21332d; --clo:#cf9be0; --clo-soft:#2f2336;
  --me:#262d2b; --flag:#f0a070; --flag-soft:#3a271c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
.app{max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}
header{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.clock{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"].kal{background:var(--kal);color:var(--panel)}
.seg button[aria-pressed="true"].clo{background:var(--clo);color:var(--panel)}
.seg button[aria-pressed="true"].neutro{background:var(--fg);color:var(--panel)}
.seg button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
label.small{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
input[type=text]{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);width:9em}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.on{border-color:transparent;background:var(--kal-soft);color:var(--kal)}
.pill.on.clo{background:var(--clo-soft);color:var(--clo)}
.ghost{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:5px 10px;border-radius:6px;cursor:pointer}
main{flex:1;overflow-y:auto;padding-block:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{display:flex;flex-direction:column;gap:4px;max-width:88%;min-width:0}
.msg.me{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;font-weight:600;letter-spacing:.02em}
.who.kal{color:var(--kal)} .who.clo{color:var(--clo)} .who.me{color:var(--muted)}
.bubble{padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--me);border-color:transparent}
.msg.kal .bubble{border-left:3px solid var(--kal)}
.msg.clo .bubble{border-left:3px solid var(--clo)}
.msg.flagged .bubble{background:var(--flag-soft)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tools button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.tools button.on{color:var(--flag);font-weight:600}
.note{font:inherit;font-size:13px;width:100%;box-sizing:border-box;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
details{font-size:12px;color:var(--muted);max-width:100%}
details pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:16em;overflow:auto;margin:4px 0 0}
.empty{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:8px;padding-block:8px}
.empty b{color:var(--fg);font-weight:600}
.ex{display:flex;gap:6px;flex-wrap:wrap}
.ex button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;cursor:pointer}
form{display:flex;gap:8px;padding-block:10px 14px;border-top:1px solid var(--line)}
textarea{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);resize:none;height:2.6em}
.send{border:0;border-radius:8px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer;color:var(--panel);background:var(--fg)}
.send:disabled{opacity:.5;cursor:default}
.status{font-size:12.5px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--flag)}
@media (prefers-reduced-motion:no-preference){.bubble{transition:background .15s}}
</style>

<div class="app">
  <header>
    <div class="top">
      <h1>Plantão de teste</h1>
      <span class="clock" id="clock">--:--</span>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Quem responde">
        <button type="button" id="b-kal" class="kal" aria-pressed="false">Kal'tsit</button>
        <button type="button" id="b-clo" class="clo" aria-pressed="false">Closure</button>
      </div>
      <span class="pill" id="duty">de plantão</span>
    </div>
    <div class="row">
      <label class="small" for="nome">Seu nome no canal <input type="text" id="nome" value="mizuki" autocomplete="off"></label>
      <label class="small" for="pron">Pronomes <input type="text" id="pron" value="" placeholder="ex.: ele/dele" autocomplete="off" style="width:7.5em"></label>
      <div class="seg" role="group" aria-label="Modelo">
        <button type="button" id="m-quick" class="neutro" aria-pressed="true">Rápido</button>
        <button type="button" id="m-default" class="neutro" aria-pressed="false">Padrão</button>
      </div>
      <button type="button" class="ghost" id="novo">Nova conversa</button>
      <button type="button" class="ghost" id="copiar">Copiar conversa</button>
    </div>
  </header>
  <main id="log" aria-live="polite"></main>
  <div class="status" id="status"></div>
  <form id="f">
    <textarea id="txt" placeholder="Mensagem pro canal" aria-label="Mensagem"></textarea>
    <button class="send" id="enviar" type="submit">Enviar</button>
  </form>
</div>

<script>
const D = /*__DATADOS__*/null;

// ---------- utilidades ----------
const $ = id => document.getElementById(id);
const STRIP = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
// expressão de conversa com palavra de regra ("morrendo de sono", "que dano", "a guia do servidor") sai antes de procurar termo e livro
const IDIOMA = /(?<![\p{L}])(?:(?:morrendo|morta|morto|morri|morro) de (?:sono|fome|rir|tédio|tedio|vergonha|calor|frio|saudade|cansaço|cansaco|medo|raiva)|que dano(?=\s*(?:hein|kkk+|mano|cara|véi|vei|[!.]|$))|(?:to|tô|tou|estou|fiquei|fico|ando|tava|tô meio|to meio) sem energia|(?:minha|tua|sua|nossa) vida (?:t[aá]|est[aá]|anda) (?:uma|um|muito|meio|corrida|dif[ií]cil|complicada|bagun[cç]ada|parada)|vida corrida|(?:a|uma) guia do servidor|(?:minha|sua|tua|nossa|essa) guia|guia (?:favorita|preferida|querida|predileta)|guias? turístic\w*|(?:filme|filmes|série|series|séries|anime|animes|novela|documentário|documentario|desenho|mangá|manga) d[eoa]s? \p{L}+|(?:obg|obgd|obrigad[oa]|valeu|vlw|brigad[oa]|tmj),? guia(?![\p{L}])|classes? d[aeo] (?:faculdade|escola|aula|colégio|colegio|facul)|nível de (?:cansaço|cansaco|estresse|stress|sono|paciência|paciencia|fome|tédio|tedio|ódio|odio|preguiça|preguica)|ritua(?:l|is) de iniciação|ritua(?:l|is) de iniciacao|revistas? técnic\p{L}*|(?:assistência|assistencia|suporte|curso|ensino|escola|falha|problema|parte|ficha) técnic\p{L}*|técnicas? de (?:estudo|respiração|respiracao|relaxamento|venda|cozinha)\p{L}*|(?:manual|manuais) de montagem|montagem d[eoa]s? (?:móve|move|armário|armario|guarda|estante|lego|pc|computador|vídeo|video)\p{L}*|guias? (?:de|do|da|dos|das|pra|para) (?:restaurante|viage|turism|estud|compra|bolso|carreira|cidade|bairro|museu|filme|série|serie|anime|jogo|presente|receita|sobreviv|programa|instala|configura|celular)\p{L}*|ritua(?:l|is) (?:matina\p{L}*|di[aá]ri\p{L}*|de sempre|de beleza|de skincare|de limpeza|de toda (?:manhã|manha|noite)|de todo (?:dia|domingo)|da (?:manhã|manha|noite)|de (?:café|cafe|academia|estudo|sono|acordar|dormir|treino|treinar|estudar|leitura|ler|meditar|meditação|meditacao|organização|organizacao)\p{L}*)|(?:é|e|sou|ser|tipo) (?:a|uma) guia|(?:a )?outra guia|(?:as|das|duas) guias|(?:t[aáoô]|tou|fic\w*|est[aáo]\w*|bot\w*|levant\w*) (?:de )?p[eé]|(?:em|a|no|com o) p[eé]|(?<!ainda de )pé)(?![\p{L}])/giu;
// fala citada entre aspas, com três palavras ou mais ("você precisa de CD 20"), não aciona o lorebook; termo citado sozinho ("Refino") aciona
const CITACAO = /"([^"]*)"|“([^”]*)”/g;
const semIdioma = s => s.replace(CITACAO, (m, a, b) => ((a ?? b).trim().split(/\s+/).length >= 3 ? " " : m)).replace(IDIOMA, " ");
const norm = s => { s = semIdioma(s.toLowerCase()); return s + "\n" + STRIP(s); };
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const BORDA = k => new RegExp("(?<![\\p{L}\\p{N}_])" + esc(k) + "(?![\\p{L}\\p{N}_])", "u");
const horaBR = () => { const d = new Date(Date.now() - 3 * 3600e3); return { h: d.getUTCHours(), m: d.getUTCMinutes() }; };
const deTurno = h => (h >= 9 && h < 21) ? "kal" : "clo";
const NOME = { kal: "Kal'tsit", clo: "Closure" };

// ---------- lorebook (igual ao ferramentas/ativar_lorebook.py) ----------
const KEYRE = D.lore.map(e => e.key.map(k => BORDA(k)));
function ativar(texto, soTermos = null) {
  const t = norm(texto), hit = [], tt = soTermos === null ? t : norm(soTermos);
  D.lore.forEach((e, i) => {
    if (e.constant) return;
    let n = 0; e.key.forEach((k, j) => { if (KEYRE[i][j].test(e.group === "sistema" ? tt : t)) n = Math.max(n, k.length); });
    if (n) hit.push([n, e]);
  });
  hit.sort((a, b) => b[0] - a[0]);
  const sempre = D.lore.filter(e => e.constant);
  const mundo = hit.filter(x => x[1].group === "mundo").slice(0, 5).map(x => x[1]);
  const termos = hit.filter(x => x[1].group === "sistema").slice(0, 3).map(x => x[1]);
  const E = sempre.concat(mundo, termos);
  return { nomes: E.map(e => e.comment), texto: E.map(e => e.content).join("\n\n"), termos };
}

// ---------- livro: âncora dos termos acionados + os blocos que mais casam com a mensagem (busca v8) ----------
const PARADA = new Set(("a o e de da do das dos que pra para por com sem um uma uns umas no na nos nas em é eu vc voce você tu se me te meu minha seu sua isso isto esse essa aqui ai aí la lá ja já mais menos muito pouco quando como qual quais quanto quantos onde porque pq tá ta to tô ou mas nao não sim ele ela eles elas ser ter tem tenho foi vai vou pode posso faz fazer " +
  "closure kal kaltsit kal'tsit mizuki livro regra regras dele dela deles delas oque qnt qnts cm for fosse seria tiver tivesse estiver nele nela neles nelas").split(" "));
// "nv2", "nvl 2", "lv2" viram "nivel 2"; palavra longa fica com as 6 primeiras letras, pra "estabilizo" achar "estabilizar",
// "habilidades" achar "habilidade" e erro no fim da palavra ("evocadr") não atrapalhar
// "iniciativa" não pode virar "inicia" junto com "inicial", nem "recomposição" virar "recomp" junto com "recompensa"
const RAIZ = w => /^(nivel|classe)\d+$/.test(w) ? w : w.startsWith("iniciativ") ? "inictv" : w.startsWith("recompos") ? "recmps" : w.length > 6 ? w.slice(0, 6) : (w.length > 4 && w.endsWith("s") ? w.slice(0, -1) : w);
// "nível 7" também vira a palavra "nivel7", pra pergunta de um nível achar a página que diz "Nível 7."
const nrm = s => STRIP(s.toLowerCase()).replace(/(?<![a-z])(?:nv|nvl|niv|lv|lvl)\.?\s?(\d+)/g, "nivel $1").replace(/(?<![a-z])nivel\s?(\d+)/g, "nivel nivel$1").replace(/(?<![a-z])classe\s?(\d+)/g, "classe classe$1").replace(/(\d)(m|km|kg)(?![a-z0-9])/g, "$1 $2").replace(/(?<![a-z0-9])0\s?(?=(?:de\s)?(?:vida|pv|hp)(?![a-z]))/g, "zero ");
// sinônimo de mesa pra palavra que o livro usa
const SINONIMO = { caindo: "queda", cair: "queda", caio: "queda", upar: "nivel", level: "nivel", hp: "vida", shikig: "invoca", voar: "voo", voando: "voo", desmai: "incons",
  // verbo na primeira pessoa que não bate com o radical do livro ("agarro" e "agarrar")
  agarro: "agarra", agarre: "agarra", agarrao: "agarra", escapo: "escapa", ataco: "atacar",
  // custo e preço são a mesma pergunta ("quanto custa", "gasta quanto PE", "preço do traje"); "tank" é o Bastião
  custa: "preco", custo: "preco", custar: "preco", custam: "preco", gasta: "preco", gasto: "preco", gastar: "preco", gastam: "preco",
  tank: "bastia", tanker: "bastia", tanque: "bastia", ataquei: "atacar", corro: "correr", pulo: "pular", esquivo: "esquiv", voa: "voo",
  // gíria de jogo que o livro escreve em português ("stun" é Atordoado, "clash" de domínio é Disputa, "zerou o hp")
  stun: "atordo", crit: "critic", critei: "critic", critou: "critic", stunad: "atordo", stunou: "atordo", clash: "disput", zerou: "zero", zerei: "zero", zerado: "zero", zerada: "zero", zerar: "zero", conser: "reparo", consert: "reparo",
  morrer: "morte", morre: "morte", morreu: "morte", morto: "morte", morta: "morte", pv: "vida", caneta: "lapis", vence: "vitori", venceu: "vitori", ganhador: "vitori", pular: "salto", pulo: "salto", pulei: "salto", pula: "salto", curar: "cura", curo: "cura", curando: "cura", curou: "cura",
  // "quantos pv eu começo?" é a Vida inicial
  comeco: "inicia", comeca: "inicia", comecar: "inicia",
  // a Origem Feto virou Híbrido no R45 (item 193), e quem jogou antes ainda chama pelo nome velho
  feto: "hibrid" };
const tok = s => (nrm(s).match(/[a-z0-9]{3,}|(?<![a-z0-9])(?:xp|pe|pv|hp|cd|tr|rd|ce)(?![a-z0-9])/g) || []).map(RAIZ).map(w => SINONIMO[w] || w);
const DF = new Map(), BTOK = D.livro.map(b => {
  const c = new Map(); for (const w of tok(b.titulo + " " + b.titulo + " " + (b.titulos || []).join(" ") + " " + b.texto)) c.set(w, (c.get(w) || 0) + 1);
  for (const w of c.keys()) DF.set(w, (DF.get(w) || 0) + 1); return c;
});
const NB = D.livro.length;
// erro de digitação no meio da palavra ("funsiona"): troca pela palavra do livro a uma letra de distância, com a mesma inicial
const VOCAB = [...DF.keys()];
function perto(a, b) {
  if (a[0] !== b[0] || Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, e = 0;
  while (i < a.length && j < b.length) { if (a[i] === b[j]) { i++; j++; continue; } if (++e > 1) return false; if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; } }
  return e + (a.length - i) + (b.length - j) <= 1;
}
// palavra cortada em 6 letras perde a letra que sobrou: "decanso" vira "decans" e só bate com "descan" comparando 5 com 6
const perto6 = (w, v) => perto(w, v) || (w.length === 6 && v.length === 6 && (perto(w.slice(0, 5), v) || perto(w, v.slice(0, 5))));
const corrigir = w => DF.has(w) || w.length < 5 ? w : (VOCAB.filter(v => perto6(w, v)).sort((x, y) => DF.get(y) - DF.get(x))[0] || w);
// títulos do livro com duas palavras ou mais ("Olhos Em Mim", "Vida a zero", "Abrir Caminho") contam como frase exata
const TTOK = D.livro.map(b => new Set(tok([b.titulo, ...(b.titulos || [])].filter(t => !/continua/i.test(t)).join(" ")).filter(w => !PARADA.has(w))));
// títulos de uma palavra que também são palavra de papo ("tem tempo?", "no começo") não abrem a busca sozinhos
const TITULO_COMUM = new Set(tok("tempo falha encerrar começo novo livre resposta caminho trilha mesa ideia ver sai igual número menor linha longe passo chão rápido voz luz roupa peso altura aberto tema dúvida saúde história valores marco onda tarefa acesso área objeto tanto par cópia aviso barulho vazio prática raiz venda massa puxa eco cerca colar telefone limpar sugar campanha jogador"));
// título de duas palavras feito só de palavra comum ("De novo", "Uma vez") não conta como citado
const conteudo = t => { const ws = tok(t).filter(w => !PARADA.has(w) && !TITULO_COMUM.has(w)); return ws.length >= 2 || ws.some(w => (DF.get(w) || 0) <= 60); };
const TITULOS = D.livro.map(b => [...new Set([b.titulo, ...(b.titulos || [])])].filter(t => !/continua/i.test(t)).map(t => " " + nrm(t).replace(/[^a-z0-9]+/g, " ").trim() + " ").filter(t => t.split(" ").filter(Boolean).length >= 2 && conteudo(t)));
// Caminhos do livro: o nome do Caminho, ou o título de uma página dele com uma palavra só ("Executor"), puxa as páginas do Caminho
const CAMINHOS = ["bastiao", "vanguarda", "guia", "emanador", "evocador", "incursor"];
const FAM = D.livro.map(b => b.ancora.split("--")[0]);
const FAMILIA_DE = new Map(CAMINHOS.map(c => [RAIZ(c), c]));
// termos com endereço: o índice e o glossário do livro ligam cada termo à página que o define ("[Agarrar](#geral--manobras)");
// a linha em negrito de uma tabela ("| **Esquivar** |") e o nome de item de catálogo ("| Katana (espada curva) |", com preço ou dano) também
const POS = new Map(D.livro.map((b, i) => [b.ancora, i]));
const TERMO = new Map();
// palavra solta só vale se for pouco usada no livro (até 40 páginas; 100 quando é o título de uma seção, como "Iniciativa");
// nome de Caminho fica de fora porque já tem a regra de família
const poeTermo = (nome, i, limite = 40, M = TERMO) => { const k = tok(nome.replace(/\(.*?\)|\*/g, " ")).filter(w => !PARADA.has(w)).join(" "); if (k && !FAMILIA_DE.has(k) && !TITULO_COMUM.has(k) && (k.includes(" ") || (DF.get(k) || 999) <= limite)) { if (!M.has(k)) M.set(k, new Set()); M.get(k).add(i); } };
D.livro.forEach((b, i) => {
  for (const m of b.texto.matchAll(/\[([^\]]+)\]\(#([\w-]+)\)/g)) if (POS.has(m[2])) poeTermo(m[1], POS.get(m[2]));
  for (const m of b.texto.matchAll(/^\| \*\*([^*|]+)\*\* \|/gm)) poeTermo(m[1], i);
  for (const tab of b.texto.split(/\n(?!\|)/)) if (/^\|[^\n]*(Dano|Preço)/.test(tab.trim())) for (const m of tab.matchAll(/^\| ([^|*]+) \|/gm)) poeTermo(m[1], i);
  // títulos de seção, inteiros e em partes ("Agarrar, derrubar e empurrar" também vale "derrubar")
  if (!/exemplo/i.test(b.titulo)) for (const t of [b.titulo, ...(b.titulos || [])]) if (!/continua|exemplo/i.test(t)) for (const parte of [t, ...t.split(/,| e /)]) poeTermo(parte, i, t === b.titulo ? 100 : 40);
});
// nome em negrito abrindo parágrafo ("**Passagem.** Uma vez por dia...") é habilidade ou opção definida ali; muitos são palavra comum ("Tudo", "Canto"),

  const vale = (r, i) => { const g = N[r].slice(i, i + 3); return !g.every(x => PARADA.has(x)) && !g.some(x => /\d/.test(x) || /^(kal|tsit|closure|kaltsit)$/.test(x)) && !TERMO[r].slice(i, i + 3).some(Boolean); };
  N.forEach((n, r) => { const vistos = new Set(); for (let i = 0; i + 3 <= n.length; i++) if (vale(r, i)) vistos.add(chave(n, i)); for (const k of vistos) conta.set(k, (conta.get(k) || 0) + 1); });
  const rep = k => conta.get(k) >= 2 && !JA_DITO.includes(" " + k + " ");
  const frases = [];
  for (let r = N.length - 1; r >= 0; r--) { const n = N[r]; for (let i = 0; i + 3 <= n.length; i++) {
    if (!vale(r, i) || !rep(chave(n, i))) continue;
    let j = i; while (j + 4 <= n.length && vale(r, j + 1) && rep(chave(n, j + 1))) j++;
    const f = bot[r].slice(i, j + 3).join(" "), fn = n.slice(i, j + 3).join(" ");
    if (!frases.some(x => x[1].includes(fn))) frases.push([f, fn]); i = j + 2;
  } }
  const out = frases.slice(0, 3).map(([f]) => `"${f}"`);
  const fins = N.slice(-4).map(n => n[n.length - 1]).filter(x => INTERJ.has(x));
  const fim = fins.find(x => fins.filter(y => y === x).length >= 2); if (fim) out.push(`terminar com "${fim}"`);
  // abertura: a mesma palavra nas três últimas; se for de fórmula ("Pelo livro,", "No livro,", "Olha,"), já em duas das três
  const ab3 = bot.slice(-3), ab = ab3.map(w => w[0]), abN = ab.map(NW);
  const form = abN.find(x => FORMULA_ABRE.has(x) && abN.filter(y => y === x).length >= 2);
  if (ab.length === 3 && abN.every(x => x === abN[0]) && !/\d/.test(ab[0])) out.push(`começar com "${ab[0]}"`);
  else if (form) { const com = ab3.filter(w => NW(w[0]) === form), seg = com.map(w => NW(w[1] || "")); const w = com[com.length - 1]; out.push(`começar com "${seg.every(x => x && x === seg[0]) ? w[0] + " " + w[1] : w[0]}"`); }
  return out.length ? `\n[Você já usou nesta conversa: ${out.join("; ")}. Diga de outro jeito ou não diga.]` : "";
}
function montarPrompt(msg, nome) {
  const P = D.pers[pers];
  const recentes = turnos.filter(t => t.de === "user").slice(-2).map(t => t.texto).join(" ");
  // mundo olha as duas mensagens anteriores, pra conversa não perder o assunto; termo do livro só vale na mensagem em que aparece, a não ser num seguimento ("e o custo?")
  const a = ativar(recentes + " " + msg, /^(e|mas|entao|tipo|como assim)\b/.test(STRIP(msg.toLowerCase()).trim()) ? null : msg);
  // a âncora do livro vem só dos termos da mensagem atual; termo que ficou das mensagens anteriores não ocupa vaga do livro
  const livro = blocosLivro(msg, ativar(msg).termos, turnos.filter(t => t.de === "user").slice(-2).map(t => t.texto));
  let ctx = a.texto;
  for (const b of livro) ctx += `\n\n[Livro, âncora ${b.ancora}]\n${b.texto}`;
  const nl = nome.trim().toLowerCase();
  if (nl === "mizuki") ctx += "\n\n[Servidor: quem fala é o Mizuki, ID 459030926928904230, que criou o mundo do Ciclo Maldito e o sistema.]";
  else if (/mizuki/i.test(msg)) ctx += "\n\n[Servidor: o Mizuki criou o mundo do Ciclo Maldito e o sistema. Quem fala agora não é ele.]";
  if (/anivers[aá]rio/i.test(msg)) ctx += "\n\n" + P.aniversario;
  const regras = "Você está num teste de personagem de um bot de Discord. Siga o prompt de sistema abaixo à risca. Cada mensagem minha traz o contexto ativado, o estado do momento, a mensagem nova e um lembrete no fim. Responda só com a fala da personagem, sem prefixo de nome, sem aspas e sem comentário.\n\n=== PROMPT DE SISTEMA ===\n" + P.sistema;
  const hist = [];
  for (const t of turnos.slice(-24)) hist.push(t.de === "user" ? { role: "user", content: `${t.nome}: ${t.texto}` } : { role: "assistant", content: t.texto });
  const ultimo = `[Contexto ativado]\n${ctx}\n\n${linhaEstado(nome, $("pron").value)}\n\n[Mensagem]\n${nome.trim() || "alguém"}: ${msg}\n\n${P.lembrete}${foraDoPlantao(msg, a.termos.length > 0, a.nomes.some(n => n.startsWith("Mundo:") && n !== "Mundo: premissa"))}${repeticoes()}`;
  return { input: [{ role: "user", content: regras }, ...hist, { role: "user", content: ultimo }], ativadas: a.nomes.concat(livro.map(b => "Livro: " + b.titulo)), ctx };
}

// ---------- tela ----------
function pintar() {
  $("b-kal").setAttribute("aria-pressed", pers === "kal"); $("b-clo").setAttribute("aria-pressed", pers === "clo");
  $("m-quick").setAttribute("aria-pressed", modelo === "quick"); $("m-default").setAttribute("aria-pressed", modelo === "default");
  const h = horaBR(), on = deTurno(h.h) === pers;
  $("clock").textContent = `${String(h.h).padStart(2, "0")}:${String(h.m).padStart(2, "0")} em Brasília`;
  const d = $("duty"); d.textContent = on ? "de plantão agora" : `fora do turno (é da ${NOME[deTurno(h.h)]})`;
  d.className = "pill" + (on ? " on" + (pers === "clo" ? " clo" : "") : "");
  $("txt").placeholder = `Mensagem pro canal (${NOME[pers]} responde)`;
  const log = $("log"); log.textContent = "";
  if (!turnos.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = `<b>Conversa nova com a ${NOME[pers]}.</b><span>Escreva como no Discord. Cada resposta tem "Estranha" pra marcar a fala que soou artificial, e a conversa fica salva pro Claude ler depois.</span>`;
    const ex = document.createElement("div"); ex.className = "ex";
    const X = pers === "kal" ? ["boa tarde kal", "a Rhine é do mal?", "perdi 1/4 da integridade, e agora?", "kal vc gosta de café?"] : ["boa noite closure", "o crítico dobra o bônus também?", "closure manda um meme ai", "a kal'tsit é mais legal que vc?"];
    for (const s of X) { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => { $("txt").value = s; $("txt").focus(); }; ex.append(b); }
    e.append(ex); log.append(e); return;
  }
  turnos.forEach((t, i) => {
    const m = document.createElement("div"); const p = t.de === "user" ? "me" : t.pers;
    m.className = "msg " + p + (t.estranha ? " flagged" : "");
    const w = document.createElement("div"); w.className = "who " + p; w.textContent = t.de === "user" ? t.nome : NOME[t.pers]; m.append(w);
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = t.texto || "…"; m.append(b);
    if (t.de === "bot" && t.texto) {
      const tl = document.createElement("div"); tl.className = "tools";
      const fl = document.createElement("button"); fl.type = "button"; fl.textContent = t.estranha ? "Marcada como estranha" : "Estranha";
      fl.className = t.estranha ? "on" : ""; fl.onclick = () => { t.estranha = !t.estranha; if (!t.estranha) t.nota = ""; salvar(); pintar(); };
      tl.append(fl);
      if (t.ativadas?.length) {
        const det = document.createElement("details"); const s = document.createElement("summary"); s.textContent = "contexto (" + t.ativadas.length + ")";
        const pre = document.createElement("pre"); pre.textContent = t.ativadas.join("\n"); det.append(s, pre); tl.append(det);
      }
      m.append(tl);
      if (t.estranha) {
        const n = document.createElement("input"); n.type = "text"; n.className = "note"; n.id = "nota-" + i; n.placeholder = "O que soou estranho? (opcional)"; n.value = t.nota || "";
        n.onchange = () => { t.nota = n.value; salvar(); }; m.append(n);
      }
    }
    log.append(m);
  });
  log.scrollTop = log.scrollHeight;
}
const status = (s, err) => { const e = $("status"); e.textContent = s || ""; e.className = "status" + (err ? " err" : ""); };

// ---------- guardar (db) ----------
async function salvar() {
  if (!db || !turnos.length) return;
  try {
    if (!convId) convId = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await db.doc("conversas/" + convId).set({
      atualizada: new Date().toISOString(), modelo, cards: D.versoes,
      turnos: turnos.map(t => ({ de: t.de, pers: t.pers || null, nome: t.nome || null, texto: t.texto, estranha: !!t.estranha, nota: t.nota || "", ativadas: t.ativadas || [] })),
    });
  } catch (e) { status("Não consegui salvar a conversa (" + (e.code || "erro") + "). Ela continua aqui na tela.", true); }
}

// ---------- enviar ----------
const ERRO = { not_granted: "O Claude não foi liberado nesta página. Libere no menu de permissões do artifact pra testar.", rate_limited: "Muitas mensagens seguidas. Espere um pouco e mande de novo.", sampling_disabled: "O Claude não está disponível nesta conta.", session_expired: "Sua sessão expirou. Entre de novo no claude.ai.", refused: "O Claude recusou essa mensagem. Tente com outras palavras." };
async function enviar(ev) {
  ev.preventDefault();
  const msg = $("txt").value.trim(); if (!msg || ocupado) return;
  if (!sample) { status("O teste precisa abrir dentro do claude.ai pra falar com o Claude.", true); return; }
  const nome = $("nome").value;
  const { input, ativadas } = montarPrompt(msg, nome);
  turnos.push({ de: "user", nome: nome.trim() || "alguém", texto: msg });
  const bot = { de: "bot", pers, texto: "", ativadas }; turnos.push(bot);
  $("txt").value = ""; ocupado = true; $("enviar").disabled = true; status(NOME[pers] + " está escrevendo…"); pintar();
  ctl = new AbortController();
  try {
    const r = await sample(input, { modelTier: modelo, cache: false, signal: ctl.signal, onText: ({ text }) => { bot.texto = text; const bs = $("log").querySelectorAll(".bubble"); bs[bs.length - 1].textContent = text; } });
    bot.texto = r.text.trim(); status(""); salvar();
  } catch (e) {
    if (e.text) bot.texto = e.text; else turnos.splice(turnos.indexOf(bot), 1);
    status(ERRO[e.code] || "Deu erro na resposta (" + (e.code || "?") + "). Mande de novo.", true);
  } finally { ocupado = false; $("enviar").disabled = false; pintar(); }
}

$("f").addEventListener("submit", enviar);
$("txt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); } });
$("b-kal").onclick = () => { if (pers !== "kal") { pers = "kal"; if (turnos.length) novo(); else pintar(); } };
$("b-clo").onclick = () => { if (pers !== "clo") { pers = "clo"; if (turnos.length) novo(); else pintar(); } };
$("m-quick").onclick = () => { modelo = "quick"; pintar(); };
$("m-default").onclick = () => { modelo = "default"; pintar(); };
function novo() { ctl?.abort(); turnos = []; convId = null; status(""); pintar(); }
$("novo").onclick = novo;
$("copiar").onclick = async () => {
  if (!turnos.length) { status("A conversa ainda está vazia."); return; }
  const txt = `[${NOME[pers]} · card ${pers === "kal" ? D.versoes.kaltsit : D.versoes.closure} · ${modelo === "quick" ? "Rápido" : "Padrão"}]\n` + turnos.map(t => (t.de === "user" ? t.nome : NOME[t.pers]) + ": " + t.texto + (t.estranha ? "  [ESTRANHA" + (t.nota ? ": " + t.nota : "") + "]" : "")).join("\n");
  try { await navigator.clipboard.writeText(txt); status("Conversa copiada. É só colar no Discord pro Mizuki."); }
  catch { const a = document.createElement("textarea"); a.value = txt; document.body.append(a); a.select(); try { document.execCommand("copy"); status("Conversa copiada. É só colar no Discord pro Mizuki."); } catch { status("Não deu pra copiar automaticamente.", true); } a.remove(); }
};
setInterval(() => { const c = $("clock"); const h = horaBR(); c.textContent = `${String(h.h).padStart(2, "0")}:${String(h.m).padStart(2, "0")} em Brasília`; }, 30000);
pintar();

(async () => {
  try { sample = await claude.use("sample"); } catch { sample = null; }
  try { db = await claude.use("db"); } catch { db = null; }
  if (!sample) {
    // diagnóstico pra print: em que tipo de tela a página abriu e o que o claude.ai respondeu
    const temClaude = typeof window.claude !== "undefined", emQuadro = window.top !== window;
    let perm = "?";
    try { const p = temClaude ? await claude.use("permissions") : null; if (p) perm = await p.state("sample"); else perm = "sem permissões"; } catch (e) { perm = "erro " + (e && e.code || ""); }
    const onde = !temClaude ? "aberta fora do claude.ai" : !emQuadro ? "aberta como página solta, fora da tela do claude.ai" : "dentro do claude.ai, mas o Claude não foi liberado nesta visualização";
    status(`O Claude não está disponível aqui (${onde}; quadro ${emQuadro ? "sim" : "não"}; permissão ${perm}). Manda um print disso pro Mizuki.`, true);
  }
})();
</script>
